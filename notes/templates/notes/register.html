{% extends "notes/base.html" %}
{% block content %}
<h1>Register</h1>
{% if error %}<p><b>{{ error }}</b></p>{% endif %}
<form method="post">
{% csrf_token %}
<p>Username: <input name="username"></p>
<p>Password: <input name="password" type="password"></p>
<button type="submit">Create account</button>
</form>
{% endblock %}
